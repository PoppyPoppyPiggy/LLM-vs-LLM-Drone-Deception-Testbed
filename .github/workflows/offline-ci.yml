name: Offline collaboration CI
on:
  pull_request:
  push:
    branches: [main, 'integration/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check collaboration guard behavior
        run: python3 -m unittest discover -s tests/collaboration -v
      - name: Check inventory, copied evidence, and reporting syntax
        run: python3 scripts/collaboration/check_repository.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
